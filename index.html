<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4fc3f0">
<title>PIE - Registro de Ações</title>
<style>
:root{--azul:#4fc3f0;--azul2:#5bc0de;--fundo:#f4fafd;--txt:#222;--borda:#cfd8dc;--verde:#2e9e4f;--verm:#d9302c}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--txt);background:#fff;font-size:16px}
header{background:var(--azul);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
.aviso{background:#fff3cd;border:2px solid #e0a800;color:#5c4400;font-weight:bold;text-align:center;padding:10px;font-size:15px}
main{padding:14px;max-width:900px;margin:0 auto}
h2{font-size:17px;text-align:center;margin:10px 0}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:0;background:#dde3e6;border-radius:6px 6px 0 0;font-size:14px;color:#555}
.tabs button.on{background:var(--azul);color:#fff;font-weight:bold}
.card{background:#e8f6fc;border:1px solid #b9e3f5;border-radius:6px;padding:10px;margin-bottom:12px;font-size:14px}
label{display:block;font-size:14px;font-weight:bold;margin:12px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px;border:1px solid var(--borda);border-radius:6px;font-size:16px;background:#fff}
textarea{min-height:170px;resize:vertical}
button.b{padding:12px 16px;border:0;border-radius:6px;font-size:16px;color:#fff;background:var(--azul2)}
button.verde{background:var(--verde)}
button.cinza{background:#888}
button.sec{background:#fff;color:#0b7aa8;border:1px solid var(--azul2)}
button:disabled{opacity:.5}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hab{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e3e3e3;padding:10px 4px;font-size:14px}
.x{background:var(--verm);color:#fff;border:0;border-radius:4px;width:34px;height:34px;font-size:16px}
fieldset{border:1px solid var(--borda);border-radius:6px;margin:14px 0;padding:8px 12px}
legend{font-weight:bold;font-size:14px}
.amarelo{background:#fff3cd;border:1px solid #f1e0a0;text-align:center;font-size:13px;padding:8px;margin:12px 0}
.fotos{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.foto{width:46%;max-width:210px;border:1px solid var(--borda);border-radius:6px;padding:4px;position:relative}
.foto img{width:100%;border-radius:4px;display:block}
.foto .x{position:absolute;top:6px;right:6px}
.foto input{width:100%;font-size:13px;padding:5px;margin-top:4px;border:1px solid var(--borda);border-radius:4px}
.alu{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding:12px 4px;flex-wrap:wrap}
.acao{border-bottom:1px solid #ddd;padding:10px 2px;font-size:14px}
.acao small{color:#666}
.msg{padding:10px;border-radius:6px;margin:10px 0;font-size:14px}
.msg.erro{background:#fde8e7;color:#8a1c18}.msg.ok{background:#e4f6e8;color:#1c6a34}.msg.info{background:#e8f6fc}
.cont{font-size:12px;color:#666;text-align:right}
.port h3{color:var(--azul);margin:18px 0 4px}
.port .bloco{border-left:4px solid var(--azul);padding-left:10px;margin:14px 0}
.port .imgs{border-left:4px solid #f7c948;padding-left:10px}
.port .fcard{border:1px solid #ccc;border-radius:6px;margin:10px 0;box-shadow:0 1px 4px #0002}
.port .fcard div{padding:8px 10px;font-size:13px}
.port .fcard img{width:100%;max-width:420px;display:block;margin:6px auto}
.hidden{display:none!important}
button.mic{background:#6a4fc3;padding:8px 12px;font-size:14px}
button.mic.gravando{background:#d9302c}
@media print{header,.tabs,.nao-imprimir{display:none!important}}
</style>
</head>
<body>
<header><h1>PIE · Registro de Ações</h1><button class="b sec" id="cfgBtn" style="padding:6px 10px;font-size:13px">Config.</button></header>
<div class="aviso">Atenção: Registro pessoal</div>
<div id="sync" style="font-size:12px;color:#555;text-align:center;padding:4px"></div>
<main id="app"></main>

<script>
const HABILIDADES = ["AI1 - Organizar o material escolar","AI2 - Guardar seus pertences sozinho","AI3 - Abrir mochila/estojo/lancheira sem auxílio","AI4 - Amarrar cadarços","AI5 - Colocar a mochila sozinho","AI6 - Pegar os itens necessários para a execução das atividades","AI7 - Ter hábitos de higiene pessoal e coletiva","AP1 - Reconhecer formas","AP2 - Reconhecer cores","AP3 - Reconhecer números","AP4 - Reconhecer letras","AP5 - Sequenciar corretamente","AP6 - Realizar pareamento","AP7 - Diferenciar gravuras/imagens/detalhes","AP8 - Conceitos matemáticos","AP9 - Noção de quantidade","AP10 - Montar quebra-cabeças","AP11 - Montar jogos com peças","AP12 - Diferenciar e relacionar objetos/imagens","AP13 - Manter atenção concentrada","AP14 - Manter atenção alternada","AP15 - Reconhecer sons das letras","AP16 - Reconhecer rimas e aliterações","AP17 - Memória","CM1 - Utilizar o lápis","CM2 - Recortar com as mãos","CM3 - Recortar com tesoura","CM4 - Colar sem auxílio","CM5 - Encaixar sem auxílio","CM6 - Pintar dentro dos espaços","CM7 - Desenhar","CM8 - Amassar","CM9 - Alinhavar","CM10 - Abrir embalagens/objetos","CM11 - Fechar embalagens/objetos","CM12 - Enroscar","CM13 - Desenroscar","CM14 - Modelar","CM15 - Montar","CM16 - Desmontar","CM17 - Pinçar","CM18 - Pressionar","CM19 - Apertar","CM20 - Perfurar","CM21 - Pular com um pé só","CM22 - Pular com os dois pés","CM23 - Subir degraus","CM24 - Descer degraus","CM25 - Correr em linha reta","CM26 - Agachar","CM27 - Engatinhar","CM28 - Repassar obstáculos","CM29 - Andar nas pontas dos pés","CM30 - Rolar","CM31 - Escorregar","CM32 - Saltar","CT1 - Sentar","CT2 - Esperar","CT3 - Obedecer regras","CT4 - Seguir comandos","CT5 - Responder às consignas","LC1 - Seguir instruções de um passo","LC2 - Seguir instruções de dois passos","LC22 - Compreender comandos","LC21 - Mostrar/localizar","LC8 - Produzir sons com função comunicativa","LC9 - Imitar sons","LC10 - Aumentar pedidos vocais","LC14 - Expressar desejos/sentimentos/dor","LC17 - Utilizar linguagem oral","LC23 - Expressar sentimentos ou dor","LC3 - Identificar partes do corpo","LC4 - Identificar pessoas familiares","LC5 - Identificar objetos","LC6 - Identificar figuras","LC11 - Nomear pessoas","LC12 - Nomear objetos","LC13 - Nomear figuras","LC7 - Apontar itens desejados","LC15 - Fazer contato visual","LC16 - Utilizar gestos","LC18 - Comunicação visual","LC19 - Apontar para o que deseja","LC20 - Conduzir pessoa","IS1 - Imitar movimentos grossos","IS2 - Imitar ações com objetos","IS3 - Imitar movimentos finos","IS4 - Imitar movimentos fonoarticulatórios","IS5 - Imitar movimentos em pé","IS6 - Imitar sequência de movimentos","IS7 - Interagir com colegas","IS8 - Interagir com profissionais","IS9 - Compreender expressões faciais","IS10 - Atender comandos dos colegas","IS11 - Atender comandos dos profissionais","IS12 - Participar em grupo","IS13 - Brincar com colegas","IS14 - Aceitar ajuda","IS15 - Solicitar ajuda","IS16 - Estabelecer diálogo","IS17 - Manter diálogo"];
const ALUNOS_INICIAIS = [
  {id:'a01',nome:'Aluno 01',turma:''},
  {id:'a02',nome:'Aluno 02',turma:''},
  {id:'a03',nome:'Aluno 03',turma:''},
  {id:'a04',nome:'Aluno 04',turma:''},
  {id:'a05',nome:'Aluno 05',turma:''}
];
const ENDPOINT_PADRAO = 'https://dry-unit-7e8d.fabiosantosbarueri.workers.dev';

const PROMPT_SISTEMA = `Você escreve registros de aula de um professor de inclusão escolar (PIE) da educação infantil.
REGRAS OBRIGATÓRIAS:
1. Escreva de 1 a 2 parágrafos. Cada parágrafo deve ter entre 250 e 300 letras (caracteres, contando espaços).
2. Baseie-se só nas informações resumidas que o professor passar. Não invente fatos.
3. Escolha exatamente 3 habilidades pertinentes ao assunto, da lista abaixo, escritas por extenso e exatamente como na lista (ex.: "AP10 - Montar quebra-cabeças").
4. No texto, fale dos benefícios da atividade no desenvolvimento do aluno.
5. Vá direto ao assunto. Nunca comece com frases como "Compreendo perfeitamente...".
6. Texto natural e humano, em português do Brasil. ZERO travessões (— ou –): use ponto, vírgula ou dois-pontos. Sem negrito, sem emojis, sem listas, aspas retas. Evite vocabulário de IA (fundamental, crucial, fomentar, vibrante) e conclusões genéricas positivas.
7. Responda SOMENTE com JSON válido neste formato: {"paragrafos":["..."],"habilidades":["AP10 - Montar quebra-cabeças","...","..."]}

LISTA DE HABILIDADES:
${HABILIDADES.join('\n')}`;

/* ---------- armazenamento (somente neste aparelho) ---------- */
let db;
function abrirDB(){return new Promise((ok,err)=>{const r=indexedDB.open('pier',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('acoes',{keyPath:'id'});d.createObjectStore('alunos',{keyPath:'id'})};
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>err(r.error)})}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((ok,err)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error)});
const todos=s=>req(tx(s).getAll());
const salvar=(s,o)=>req(tx(s,'readwrite').put(o));
const apagar=(s,id)=>req(tx(s,'readwrite').delete(id));
const cfg=(k,v)=>{try{if(v===undefined)return localStorage.getItem('pier_'+k);localStorage.setItem('pier_'+k,v)}catch(e){return null}};

/* ---------- sincronização na nuvem (protegida por código de acesso) ---------- */
const BASE=()=>cfg('endpoint')||ENDPOINT_PADRAO;
const H=(extra={})=>({'X-Codigo':cfg('codigo')||'',...extra});
let sincronizando=false;
const mostrarStatus=t=>{const e=$('#sync');if(e)e.textContent=t};
async function api(m,path,body,u){const r=await fetch(BASE()+path,{method:m,headers:H(u!==undefined?{'X-U':String(u)}:{}),body});
 if(r.status===401)throw new Error('código de acesso incorreto');if(!r.ok&&r.status!==404)throw new Error('erro '+r.status);return r}
const semFotos=a=>({...a,fotos:(a.fotos||[]).map(p=>({id:p.id,nome:p.nome,desc:p.desc}))});
async function sincronizar(manual){
 if(sincronizando)return;
 if(!cfg('codigo')||!BASE()){if(manual)mostrarStatus('Defina o código de acesso em Config.');return}
 sincronizando=true;mostrarStatus('Sincronizando...');
 try{
  const lista=await(await api('GET','/list')).json();const rem={};for(const k of lista)rem[k.n]=k.u;let mudou=false;
  for(const k of lista){
   if(k.n==='alunos'){if(k.u>(+cfg('alunos_u')||0)){const d=JSON.parse(await(await api('GET','/k/alunos')).text());for(const a of d.lista)await salvar('alunos',a);cfg('alunos_u',String(k.u));mudou=true}}
   else if(k.n.startsWith('a:')){const loc=acoes.find(x=>'a:'+x.id===k.n);
    if(!loc||(loc.u||0)<k.u){const a=JSON.parse(await(await api('GET','/k/'+encodeURIComponent(k.n))).text());
     if(loc)for(const p of a.fotos||[]){const lp=(loc.fotos||[]).find(x=>x.id===p.id);if(lp&&lp.src){p.src=lp.src;p.enviada=true}}
     await salvar('acoes',a);mudou=true}}}
  if(mudou){alunos=await todos('alunos');acoes=await todos('acoes')}
  for(const a of acoes){const k='a:'+a.id;if((rem[k]||0)<(a.u||0)){
   for(const p of a.fotos||[]){if(p.src&&!p.enviada){await api('PUT','/k/'+encodeURIComponent('f:'+p.id),p.src,a.u||1);p.enviada=true}}
   await salvar('acoes',a);await api('PUT','/k/'+encodeURIComponent(k),JSON.stringify(semFotos(a)),a.u||1)}}
  const au=+cfg('alunos_u')||0;if(au>(rem['alunos']||0))await api('PUT','/k/alunos',JSON.stringify({lista:alunos}),au);
  mostrarStatus('Sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  if(mudou&&!form)desenhar();
 }catch(e){mostrarStatus('Sem sincronia: '+e.message)}
 sincronizando=false;
}
async function carregarFotos(lista){let ch=false;
 for(const a of lista)for(const p of a.fotos||[]){if(!p.src&&cfg('codigo')){try{const r=await api('GET','/k/'+encodeURIComponent('f:'+p.id));if(r.ok){p.src=await r.text();p.enviada=true;ch=true}}catch(e){}}}
 if(ch)for(const a of lista)await salvar('acoes',a)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizar()});
/* ---------- microfone (ditado por voz) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function ligarMic(btn,campo,aoMudar){
 if(!SR){btn.style.display='none';return}
 let rec=null,ligado=false;
 const parar=()=>{ligado=false;btn.textContent='🎤 Falar';btn.classList.remove('gravando');try{rec&&rec.stop()}catch(e){}};
 btn.onclick=()=>{
  if(ligado){parar();return}
  rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;
  rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;t=t.trim();
   if(t){const v=campo.value;campo.value=(v&&!/\s$/.test(v)?v+' ':v)+t.charAt(0).toUpperCase()+t.slice(1);aoMudar()}};
  rec.onend=()=>{if(ligado){try{rec.start()}catch(e){parar()}}};
  rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){parar();alert('Permita o uso do microfone no navegador para ditar.')}else if(ev.error!=='no-speech'&&ev.error!=='aborted'){parar()}};
  try{rec.start();ligado=true;btn.textContent='⏹ Parar';btn.classList.add('gravando')}catch(e){parar()}
 };
}

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>new Date().toISOString().slice(0,10);
const br=d=>d?d.split('-').reverse().join('/'):'';
const letras=s=>s.length;
function limpar(t){return t.replace(/[—–]/g,',').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\*\*/g,'').trim()}
function reduzirFoto(file,max=1280){return new Promise((ok,err)=>{const img=new Image();const u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};
 img.onerror=()=>err(new Error('Não consegui ler a foto'));img.src=u})}

/* ---------- estado ---------- */
let alunos=[],acoes=[],aluno=null,aba='alunos',form=null;

async function iniciar(){
 await abrirDB();
 alunos=await todos('alunos');
 {const antigos=alunos.filter(a=>!/^a\d+$/.test(a.id));
  if(antigos.length){const todasAc=await todos('acoes');
   for(let i=0;i<antigos.length;i++){const velho=antigos[i],nid='a0'+(i+1);
    await apagar('alunos',velho.id);await salvar('alunos',{id:nid,nome:'Aluno 0'+(i+1),turma:''});
    for(const ac of todasAc)if(ac.alunoId===velho.id){ac.alunoId=nid;ac.u=Date.now();await salvar('acoes',ac)}}
   cfg('alunos_u',String(Date.now()));alunos=await todos('alunos')}}
 for(const a of ALUNOS_INICIAIS)if(!alunos.some(x=>x.id===a.id))await salvar('alunos',a);
 alunos=await todos('alunos');
 acoes=await todos('acoes');
 desenhar();sincronizar();
}
const acoesDe=id=>acoes.filter(a=>a.alunoId===id&&!a.apagado).sort((a,b)=>b.data.localeCompare(a.data)||b.criado-a.criado);

function desenhar(){
 const app=$('#app');
 if(aba==='portfolio'){return portfolio(app)}
 if(!aluno){
  app.innerHTML=`<h2>Alunos para Atendimento</h2>`+alunos.map(a=>`<div class="alu"><div><b>${esc(a.nome)}</b><br><small>${esc(a.turma||'')}</small></div>
  <div class="linha"><button class="b sec" data-p="${a.id}">Portfólio</button><button class="b" data-a="${a.id}">Acessar</button></div></div>`).join('')+
  `<p class="linha" style="margin-top:14px"><button class="b sec" id="novoAluno">+ Adicionar aluno</button></p>
  ${cfg('codigo')?'<div class="msg info">Seus registros e fotos ficam guardados na nuvem, protegidos pelo código de acesso, e aparecem em todos os seus aparelhos.</div>':'<div class="msg erro"><b>Digite seu código de acesso</b> para ligar a sincronização entre aparelhos:<input type="text" id="cod" placeholder="Código de acesso" style="margin-top:8px"><button class="b verde" id="codOk" style="margin-top:8px">Entrar</button></div>'}`;
  if($('#codOk'))$('#codOk').onclick=()=>{cfg('codigo',$('#cod').value.trim());sincronizar(true);desenhar()};
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{aluno=alunos.find(x=>x.id===b.dataset.a);aba='nova';form=novoForm();desenhar()});
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{aluno=alunos.find(x=>x.id===b.dataset.p);aba='portfolio';desenhar()});
  $('#novoAluno').onclick=async()=>{const n=prompt('Nome do aluno:');if(!n)return;const t=prompt('Turma (opcional):')||'';await salvar('alunos',{id:'a'+Date.now(),nome:n.toUpperCase(),turma:t});alunos=await todos('alunos');cfg('alunos_u',String(Date.now()));desenhar();sincronizar()};
  return;
 }
 app.innerHTML=`<h2>${esc(aluno.nome)}${aluno.turma?' - '+esc(aluno.turma):''}</h2>
 <div class="tabs"><button data-t="alunos">Alunos</button><button data-t="nova" class="${aba==='nova'?'on':''}">Nova Ação</button><button data-t="anteriores" class="${aba==='anteriores'?'on':''}">Ações Anteriores</button><button data-t="portfolio">Portfólio</button></div><div id="conteudo"></div>`;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t==='alunos'){aluno=null;aba='alunos'}else{aba=t;if(t==='nova'&&!form)form=novoForm()}desenhar()});
 if(aba==='nova')telaNova();else telaAnteriores();
}
const novoForm=()=>({id:'x'+Date.now(),alunoId:aluno.id,data:hoje(),ambiente:'',descricao:'',intervencao:'',habilidades:[],fotos:[],criado:Date.now()});

/* ---------- Nova Ação ---------- */
function telaNova(){
 const f=form,c=$('#conteudo');
 c.innerHTML=`<div class="card"><b>Aluno:</b> ${esc(aluno.nome)}<br><b>Turma:</b> ${esc(aluno.turma||'')}</div>
 <label>Data</label><input type="date" id="data" value="${f.data}">
 <label>Ambiente da Atividade <button class="b mic" id="micAmb" type="button">🎤 Falar</button></label><input type="text" id="amb" value="${esc(f.ambiente)}">
 <label>Descrição da Atividade <button class="b mic" id="micDesc" type="button">🎤 Falar</button></label><textarea id="desc" placeholder="Escreva um resumo curto do que foi feito. A IA melhora o texto.">${esc(f.descricao)}</textarea>
 <div class="cont" id="cont"></div>
 <div class="linha" style="margin-top:6px"><button class="b" id="ia">✨ Melhorar com IA</button><span id="iaStatus" style="font-size:13px"></span></div>
 <label>Precisou de Intervenção</label>
 <select id="int"><option value="">Não Selecionado</option><option ${f.intervencao==='Sim'?'selected':''}>Sim</option><option ${f.intervencao==='Não'?'selected':''}>Não</option></select>
 <fieldset><legend>Habilidades</legend>
  <select id="addH"><option value="">Adicionar Componente Curricular</option>${HABILIDADES.map(h=>`<option>${esc(h)}</option>`).join('')}</select>
  <div id="listaH"></div></fieldset>
 <div class="amarelo">Não é obrigatório anexar uma foto, porém o portfólio do aluno será composto apenas de ações com foto</div>
 <fieldset><legend>Anexos</legend>
  <label>Nome</label><input type="text" id="fnome" placeholder="Ex.: Aula prática">
  <label>Descrição</label><input type="text" id="fdesc" placeholder="Ex.: Atividade coletiva com massinha">
  <div class="linha" style="margin-top:10px">
   <label class="b" style="margin:0;display:inline-block">Escolher ficheiro<input type="file" id="arq" accept="image/*" multiple hidden></label>
   <label class="b verde" style="margin:0;display:inline-block">📷 Tire foto<input type="file" id="cam" accept="image/*" capture="environment" hidden></label>
  </div><div class="fotos" id="fotos"></div></fieldset>
 <p style="text-align:center"><button class="b verde" id="salvar">Salvar</button> <button class="b cinza" id="cancelar">Cancelar</button></p><div id="aviso"></div>`;
 const ler=()=>{f.data=$('#data').value;f.ambiente=$('#amb').value;f.descricao=$('#desc').value;f.intervencao=$('#int').value};
 ['#data','#amb','#int'].forEach(s=>$(s).onchange=ler);
 $('#desc').oninput=()=>{ler();contar()};
 ligarMic($('#micDesc'),$('#desc'),()=>{ler();contar()});ligarMic($('#micAmb'),$('#amb'),ler);
 const contar=()=>{const ps=f.descricao.split(/\n+/).filter(Boolean);$('#cont').textContent=ps.map(p=>letras(p)+' letras').join(' | ')};contar();
 const hab=()=>{$('#listaH').innerHTML=f.habilidades.map((h,i)=>`<div class="hab"><span>${esc(h)}</span><button class="x" data-i="${i}">x</button></div>`).join('');
  $('#listaH').querySelectorAll('.x').forEach(b=>b.onclick=()=>{f.habilidades.splice(+b.dataset.i,1);hab()})};hab();
 $('#addH').onchange=e=>{if(e.target.value&&!f.habilidades.includes(e.target.value))f.habilidades.push(e.target.value);e.target.value='';hab()};
 const fotos=()=>{$('#fotos').innerHTML=f.fotos.map((p,i)=>`<div class="foto"><img src="${p.src}"><button class="x" data-i="${i}">x</button>
  <input value="${esc(p.nome)}" placeholder="Nome" data-n="${i}"><input value="${esc(p.desc)}" placeholder="Descrição" data-d="${i}"></div>`).join('');
  $('#fotos').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{f.fotos.splice(+b.dataset.i,1);fotos()});
  $('#fotos').querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>f.fotos[+i.dataset.n].nome=i.value);
  $('#fotos').querySelectorAll('[data-d]').forEach(i=>i.oninput=()=>f.fotos[+i.dataset.d].desc=i.value)};fotos();
 const add=async e=>{const nome=$('#fnome').value,desc=$('#fdesc').value;
  for(const file of e.target.files){try{f.fotos.push({id:'f'+Date.now()+Math.random().toString(36).slice(2,7),src:await reduzirFoto(file),nome,desc})}catch(x){$('#aviso').innerHTML=`<div class="msg erro">${esc(x.message)}</div>`}}
  e.target.value='';fotos()};
 $('#arq').onchange=add;$('#cam').onchange=add;
 $('#ia').onclick=()=>melhorarIA(ler,()=>{hab();$('#desc').value=f.descricao;contar()});
 $('#cancelar').onclick=()=>{form=null;aba='alunos';aluno=null;desenhar()};
 $('#salvar').onclick=async()=>{ler();if(!f.descricao.trim()){$('#aviso').innerHTML='<div class="msg erro">Escreva a descrição da atividade.</div>';return}
  f.u=Date.now();await salvar('acoes',f);acoes=await todos('acoes');form=null;aba='anteriores';desenhar();sincronizar()};
}

/* ---------- IA ---------- */
function validar(j){
 if(!j||!Array.isArray(j.paragrafos)||j.paragrafos.length<1||j.paragrafos.length>2)return 'precisa ter 1 ou 2 parágrafos';
 for(const p of j.paragrafos){const n=letras(limpar(p));if(n<250||n>300)return `um parágrafo tem ${n} letras, precisa ter entre 250 e 300`}
 if(!Array.isArray(j.habilidades)||j.habilidades.length!==3||!j.habilidades.every(h=>HABILIDADES.includes(h)))return 'precisa de exatamente 3 habilidades escritas exatamente como na lista';
 return null;
}
async function melhorarIA(ler,depois){
 ler();const f=form,st=$('#iaStatus'),bt=$('#ia');
 const url=cfg('endpoint')||ENDPOINT_PADRAO;
 if(!url){st.textContent='';$('#aviso').innerHTML='<div class="msg erro">A IA ainda não foi ligada. Veja o passo da chave nas instruções, ou cole o endereço em Config.</div>';return}
 if(!f.descricao.trim()){$('#aviso').innerHTML='<div class="msg erro">Escreva primeiro um resumo curto da atividade.</div>';return}
 bt.disabled=true;let erro=null,base=`Aluno: ${aluno.nome}.\nAmbiente: ${f.ambiente||'não informado'}.\nPrecisou de intervenção: ${f.intervencao||'não informado'}.\nResumo do professor: ${f.descricao}`;
 try{
  for(let t=1;t<=3;t++){
   st.textContent=`Escrevendo (tentativa ${t} de 3)...`;
   const msg=erro?base+`\n\nSua resposta anterior foi recusada: ${erro}. Corrija e responda só o JSON.`:base;
   const r=await fetch(url,{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({system:PROMPT_SISTEMA,mensagem:msg})});
   if(r.status===401)throw new Error('Código de acesso incorreto. Digite o código em Config.');if(!r.ok)throw new Error('Servidor da IA respondeu '+r.status);
   const d=await r.json();let txt=(d.texto||'').trim();const m=txt.match(/\{[\s\S]*\}/);let j=null;try{j=JSON.parse(m?m[0]:txt)}catch(e){}
   erro=j?validar({...j,paragrafos:(j.paragrafos||[]).map(limpar)}):'a resposta não veio em JSON';
   if(!erro){f.descricao=j.paragrafos.map(limpar).join('\n\n');f.habilidades=j.habilidades;depois();$('#aviso').innerHTML='<div class="msg ok">Texto e 3 habilidades preenchidos. Confira e ajuste se quiser.</div>';st.textContent='';bt.disabled=false;return}
  }
  throw new Error('A IA não acertou o tamanho/formato em 3 tentativas ('+erro+'). Tente de novo.');
 }catch(e){$('#aviso').innerHTML=`<div class="msg erro">${esc(e.message)}</div>`;st.textContent=''}
 bt.disabled=false;
}

/* ---------- Ações anteriores ---------- */
function telaAnteriores(){
 const l=acoesDe(aluno.id),c=$('#conteudo');
 c.innerHTML=l.length?l.map(a=>`<div class="acao"><small>${br(a.data)} · ${esc(a.ambiente||'')} ${a.fotos.length?'· 📷 '+a.fotos.length:''}</small><br>${esc(a.descricao).replace(/\n/g,'<br>')}
  <div class="cont" style="text-align:left">${a.habilidades.map(esc).join(' | ')}</div>
  <div class="linha" style="margin-top:6px"><button class="b sec" data-e="${a.id}" style="padding:6px 12px;font-size:13px">Editar</button><button class="b sec" data-x="${a.id}" style="padding:6px 12px;font-size:13px;color:#d9302c">Apagar</button></div></div>`).join(''):'<div class="msg info">Nenhuma ação registrada ainda.</div>';
 c.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{const a=acoes.find(x=>x.id===b.dataset.e);b.textContent='Carregando...';await carregarFotos([a]);form=JSON.parse(JSON.stringify(a));aba='nova';desenhar()});
 c.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('Apagar esta ação e as fotos dela?'))return;const a=acoes.find(x=>x.id===b.dataset.x);a.apagado=true;a.fotos=[];a.u=Date.now();await salvar('acoes',a);acoes=await todos('acoes');desenhar();sincronizar()});
}

/* ---------- Portfólio ---------- */
async function portfolio(app){
 const l=acoesDe(aluno.id).filter(a=>a.fotos.length);
 app.innerHTML='<div class="msg info">Carregando fotos...</div>';await carregarFotos(l);
 app.innerHTML=`<div class="nao-imprimir linha" style="margin-bottom:8px"><button class="b cinza" id="voltar">← Voltar</button><button class="b" id="imp">Imprimir / Salvar PDF</button></div>
 <div class="port"><div style="text-align:center"><b style="font-size:20px">Prefeitura Municipal de Barueri<br>SE - Secretaria de Educação</b><br>EMMEI LUIZ ANTONIO DE LIMA</div>
 <h1 style="margin:22px 0 0;font-size:24px">${esc(aluno.nome)}</h1><b>${esc(aluno.turma||'')}</b>
 ${l.length?l.map(a=>`<div class="bloco"><h3>AÇÃO</h3><b>${br(a.data)}</b><br>Ambiente: ${esc(a.ambiente||'')}<br><b>Atividade:</b> ${esc(a.descricao).replace(/\n/g,'<br>')}</div>
  <div class="imgs"><h3 style="color:#f0b429">REGISTRO DE IMAGENS</h3>${a.fotos.map(p=>`<div class="fcard"><div><b>${br(a.data)} - Autor: FABIO JOSE DOS SANTOS${p.nome?' - '+esc(p.nome):''}</b></div>${p.src?`<img src="${p.src}">`:'<div>(foto ainda não baixada)</div>'}${p.desc?`<div><b>${esc(p.desc)}</b></div>`:''}</div>`).join('')}</div>`).join(''):'<div class="msg info">O portfólio é composto apenas de ações com foto. Ainda não há nenhuma.</div>'}
 </div>`;
 $('#voltar').onclick=()=>{aba='alunos';aluno=null;desenhar()};$('#imp').onclick=()=>print();
}

/* ---------- Config e cópia de segurança ---------- */
$('#cfgBtn').onclick=()=>{
 const a=$('#app');const url=cfg('endpoint')||'';
 a.innerHTML=`<h2>Configurações</h2><label>Código de acesso (o mesmo em todos os aparelhos)</label><input type="text" id="cd" value="${esc(cfg('codigo')||'')}">
 <label>Endereço da IA e da nuvem (deixe como está se já funciona)</label><input type="text" id="ep" value="${esc(url)}" placeholder="${esc(ENDPOINT_PADRAO||'https://...')}">
 <p class="linha"><button class="b verde" id="sv">Salvar</button> <button class="b sec" id="bk">Baixar cópia de segurança</button> <label class="b sec" style="margin:0">Restaurar cópia<input type="file" id="rs" accept=".json" hidden></label> <button class="b cinza" id="vl">Voltar</button></p><div id="m"></div>`;
 $('#sv').onclick=()=>{cfg('codigo',$('#cd').value.trim());cfg('endpoint',$('#ep').value.trim());sincronizar(true);$('#m').innerHTML='<div class="msg ok">Salvo.</div>'};
 $('#vl').onclick=()=>{aluno=null;aba='alunos';desenhar()};
 $('#bk').onclick=async()=>{const d={alunos:await todos('alunos'),acoes:await todos('acoes')};const b=new Blob([JSON.stringify(d)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='pier-copia-'+hoje()+'.json';u.click()};
 $('#rs').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());for(const x of d.alunos)await salvar('alunos',x);for(const x of d.acoes)await salvar('acoes',x);alunos=await todos('alunos');acoes=await todos('acoes');$('#m').innerHTML='<div class="msg ok">Cópia restaurada.</div>'}catch(x){$('#m').innerHTML='<div class="msg erro">Arquivo inválido.</div>'}};
};
iniciar();
</script>
